<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Bitácora - Enrique C. Rébsamen</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="form-page">

    <div class="form-container-card">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h2 style="color: #1e293b; font-size: 1.6rem; font-weight: 700; margin: 0;">
                    📝 Registrar Incidencia en Bitácora
                </h2>
                <p style="color: #64748b; font-size: 0.9rem; margin-top: 4px;">
                    Añade observaciones disciplinarias o reconocimientos académicos.
                </p>
            </div>
            <a href="/menu" class="btn btn-secondary" style="margin: 0; padding: 8px 14px; font-size: 0.85rem;">
                <i class="fa-solid fa-arrow-left"></i> Volver
            </a>
        </div>

        <form action="/guardar-bitacora" method="POST" class="standard-form">

            <div class="form-group">
                <label for="id_alumno">Seleccionar Alumno <span style="color: #ef4444;">*</span></label>
                <select id="id_alumno" name="id_alumno" required>
                    <option value="" disabled selected>-- Selecciona un estudiante --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tipo">Tipo de Incidencia <span style="color: #ef4444;">*</span></label>
                <select id="tipo" name="tipo" required>
                    <option value="Observación">🟡 Observación General</option>
                    <option value="Reporte">🔴 Reporte Disciplinario</option>
                    <option value="Felicitación">🟢 Felicitación / Reconocimiento</option>
                </select>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción del Suceso <span style="color: #ef4444;">*</span></label>
                <textarea id="descripcion" name="descripcion" rows="4" placeholder="Escribe los detalles del suceso aquí..." required style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; font-family: inherit; outline: none; resize: vertical;"></textarea>
            </div>

            <button type="submit" class="btn-submit" style="width: 100%; background-color: #2563eb; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s;">
                💾 Guardar en Bitácora
            </button>

        </form>

    </div>

    <!-- Cargar Alumnos Dinámicamente -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const res = await fetch('/api/lista-alumnos');
                const alumnos = await res.json();
                const select = document.getElementById('id_alumno');

                alumnos.forEach(a => {
                    const option = document.createElement('option');
                    option.value = a.id;
                    option.textContent = `[${a.grupo}] ${a.apellido}, ${a.nombre}`;
                    select.appendChild(option);
                });
            } catch (err) {
                console.error("Error al cargar alumnos:", err);
            }
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Reporte Académico por Grupo - Enrique C. Rébsamen</title>
    <style>
        body {
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }
        .content-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .selection-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            width: 100%;
            max-width: 400px;
            border-top: 5px solid #1a2332;
        }
        h1 { color: #1a2332; margin-top: 0; font-size: 1.6rem; margin-bottom: 10px; }
        p { color: #64748b; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.4; }
        .select-grupo {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            margin-bottom: 20px;
            background-color: #f8fafc;
            color: #334155;
            outline: none;
            box-sizing: border-box;
        }
        .btn-submit {
            display: block;
            width: 100%;
            background-color: #1a2332;
            color: white;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-submit:hover { background-color: #243246; }
        .btn-back { display: inline-block; margin-top: 20px; color: #64748b; text-decoration: none; font-size: 0.9rem; }
        .btn-back:hover { color: #1a2332; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="selection-card">
            <h1>📊 Concentrado por Grupo</h1>
            <p>Selecciona un grupo escolar para calcular los promedios generales de las calificaciones registradas.</p>
            <form action="/reporte-grupo-resultado" method="GET">
                <select name="grupo" class="select-grupo" required>
                    <option value="" disabled selected>-- Elegir un grupo --</option>
                    <option value="3ºA">3ºA</option>
                    <option value="3ºB">3ºB</option>
                    <option value="3ºC">3ºC</option>
                </select>
                <button type="submit" class="btn-submit">Generar Reporte 🔍</button>
            </form>
            <a href="/menu" class="btn-back">⬅️ Volver al Panel de Control</a>
        </div>
    </div>
</body>
</html>

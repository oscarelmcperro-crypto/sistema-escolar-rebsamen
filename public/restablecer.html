<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Sistema Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <main class="login-container">
        <section class="login-card">
            <header class="login-header">
                <h2>Nueva Contraseña</h2>
                <p>Ingresa el código temporal de 6 dígitos enviado a tu correo electrónico y tu nueva clave</p>
            </header>

            <form action="/actualizar-password" method="POST" class="login-form">
                <div class="form-group">
                    <label>Código de Verificación:</label>
                    <input type="text" name="codigo" placeholder="Ej. 123456" required minlength="6" maxlength="6" style="text-align: center; font-size: 1.2rem; letter-spacing: 5px;">
                </div>
                <div class="form-group">
                    <label>Nueva Contraseña:</label>
                    <input type="password" name="nuevaPassword" placeholder="Mínimo 4 caracteres" required>
                </div>

                <button type="submit" class="btn-submit">Restablecer e Ingresar</button>
            </form>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muro de Avisos - Enrique C. Rébsamen</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-body">

    <main class="main-content" style="max-width: 800px; margin: 0 auto;">
        
        <!-- ENCABEZADO Y BOTÓN DE REGRESO -->
        <div class="page-header">
            <div class="header-title">
                <i class="fa-solid fa-bullhorn" style="font-size: 2rem; color: #3498db;"></i>
                <div>
                    <h1>Muro de Avisos y Circulares</h1>
                    <p class="subtitle">Comunicados oficiales de la institución escolar</p>
                </div>
            </div>
            <a href="/menu" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Volver al Menú</a>
        </div>

        <!-- FORMULARIO DE PUBLICACIÓN -->
        <div class="form-container-card" style="max-width: 100%; margin-bottom: 30px; border-top: 4px solid #3498db;">
            <h2 style="color: #1e293b; font-size: 1.3rem; margin-bottom: 15px;">
                <i class="fa-solid fa-pen-to-square"></i> Publicar Nuevo Comunicado
            </h2>
            
            <form action="/guardar-aviso" method="POST" class="standard-form">
                <div class="form-group">
                    <label for="titulo" style="color: #1e293b;">Título del Aviso <span style="color: #ef4444;">*</span></label>
                    <input type="text" id="titulo" name="titulo" placeholder="Ej. Junta General de Padres de Familia" required>
                </div>

                <div class="form-group">
                    <label for="contenido" style="color: #1e293b;">Contenido / Circular <span style="color: #ef4444;">*</span></label>
                    <textarea id="contenido" name="contenido" rows="4" placeholder="Escribe el mensaje o indicación completa aquí..." required style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: inherit; font-size: 0.95rem; resize: vertical; outline: none;"></textarea>
                </div>

                <button type="submit" class="btn-submit" style="background: #1e3a8a; font-weight: bold;">
                    📣 Publicar Anuncio
                </button>
            </form>
        </div>

        <!-- SECCIÓN DE COMUNICADOS RECIENTES -->
        <h2 style="color: #ffffff; font-size: 1.4rem; margin-bottom: 15px; text-shadow: 1px 1px 3px rgba(0,0,0,0.3);">
            📋 Comunicados Recientes
        </h2>

        <div id="contenedor-avisos" style="display: flex; flex-direction: column; gap: 15px;">
            <!-- Carga dinámica vía JS -->
        </div>

    </main>

    <!-- SCRIPT PARA CARGAR LOS AVISOS DINÁMICAMENTE DESDE LA API -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const res = await fetch('/api/avisos');
                const avisos = await res.json();
                const contenedor = document.getElementById('contenedor-avisos');

                if (avisos.length === 0) {
                    contenedor.innerHTML = `<div style="background: white; padding: 20px; border-radius: 10px; text-align: center; color: #64748b;">No hay avisos publicados en este momento.</div>`;
                    return;
                }

                contenedor.innerHTML = '';
                avisos.forEach(aviso => {
                    const fechaFmt = new Date(aviso.fecha || Date.now()).toLocaleDateString('es-MX', { 
                        year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
                    });

                    const tarjeta = document.createElement('div');
                    tarjeta.style.cssText = "background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.06); border-left: 5px solid #1e3a8a;";
                    
                    tarjeta.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.85rem; color: #64748b;">
                            <span><i class="fa-solid fa-user-pen"></i> <strong>${aviso.autor || 'Dirección Escolar'}</strong></span>
                            <span><i class="fa-regular fa-calendar-days"></i> ${fechaFmt}</span>
                        </div>
                        <h3 style="color: #1e293b; font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; text-transform: capitalize;">
                            ${aviso.titulo}
                        </h3>
                        <p style="color: #334155; font-size: 0.95rem; line-height: 1.5; white-space: pre-line;">
                            ${aviso.contenido}
                        </p>
                    `;
                    contenedor.appendChild(tarjeta);
                });

            } catch (err) {
                console.error("Error al cargar avisos:", err);
            }
        });
    </script>

</body>
</html>

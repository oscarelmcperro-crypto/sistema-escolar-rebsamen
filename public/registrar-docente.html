<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Personal Docente - Enrique C. Rébsamen</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 620px;
            border: 1px solid #e2e8f0;
        }

        .card-header {
            text-align: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 18px;
            margin-bottom: 25px;
        }

        .card-header h2 {
            color: #1e3a8a;
            margin: 0 0 6px 0;
            font-size: 1.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .card-header p {
            color: #64748b;
            margin: 0;
            font-size: 0.9rem;
        }

        /* GRID DE DOS COLUMNAS */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #334155;
            margin-bottom: 6px;
            font-size: 0.88rem;
        }

        input[type="text"], input[type="email"], input[type="password"], select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.92rem;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* Campo Contraseña con Botón de Ojo */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .btn-toggle-pw {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            opacity: 0.6;
        }
        .btn-toggle-pw:hover { opacity: 1; }

        /* Botón Mágico Generar */
        .btn-auto {
            background: #e0f2fe;
            color: #0369a1;
            border: 1px solid #bae6fd;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 4px;
            display: inline-block;
        }
        .btn-auto:hover { background: #bae6fd; }

        /* TARJETA INFORMATIVA DE ROL */
        .role-badge-box {
            background: #f1f5f9;
            border-left: 4px solid #3b82f6;
            padding: 12px 15px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #475569;
            margin-top: 5px;
        }

        /* BOTONES DE ACCIÓN */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }

        .btn-primary { background-color: #16a34a; color: white; }
        .btn-secondary { background-color: #64748b; color: white; }
        .btn:hover { opacity: 0.9; }

        @media (max-width: 580px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="form-card">
        
        <div class="card-header">
            <h2>👨‍🏫 Registrar Nuevo Personal</h2>
            <p>Asigna las credenciales y nivel de acceso formal al sistema escolar</p>
        </div>

        <form action="/guardar-docente" method="POST">
            
            <div class="form-grid">
                
                <!-- NOMBRE -->
                <div class="form-group">
                    <label for="font_nombre">Nombre(s):</label>
                    <input type="text" id="font_nombre" name="font_nombre" placeholder="Ej. Enrique" required oninput="sugerirUsuario()">
                </div>

                <!-- APELLIDO -->
                <div class="form-group">
                    <label for="apellido">Apellido(s):</label>
                    <input type="text" id="apellido" name="apellido" placeholder="Ej. Rébsamen" required oninput="sugerirUsuario()">
                </div>

                <!-- CORREO ELECTRÓNICO -->
                <div class="full-width form-group">
                    <label for="email">Correo Electrónico Institutional:</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@rebsamen.edu.mx" required oninput="sugerirUsuario()">
                </div>

                <!-- USUARIO -->
                <div class="form-group">
                    <label for="username">Nombre de Usuario:</label>
                    <input type="text" id="username" name="username" placeholder="Ej. prof.enrique" required>
                    <button type="button" class="btn-auto" onclick="sugerirUsuario(true)">⚡ Generar Usuario</button>
                </div>

                <!-- CONTRASEÑA -->
                <div class="form-group">
                    <label for="password">Contraseña Asignada:</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Contraseña inicial" required>
                        <button type="button" class="btn-toggle-pw" onclick="togglePassword()">👁️</button>
                    </div>
                    <button type="button" class="btn-auto" onclick="generarPasswordSegura()">🔑 Generar Clave</button>
                </div>

                <!-- ROL -->
                <div class="full-width form-group">
                    <label for="rol">Rol del Usuario (Nivel de Permisos):</label>
                    <select id="rol" name="rol" required onchange="actualizarInfoRol()">
                        <option value="2">👨‍🏫 Docente (Pase de lista, Notas y Tareas)</option>
                        <option value="1">👑 Director / Administrador (Acceso Total)</option>
                    </select>

                    <div class="role-badge-box" id="info-rol">
                        📌 <strong>Permisos Docente:</strong> Podrá registrar asistencias, capturar calificaciones, publicar tareas y revisar entregas de sus alumnos.
                    </div>
                </div>

            </div>

            <!-- BOTONES -->
            <div class="btn-group">
                <button type="submit" class="btn btn-primary">Guardar Registro 💾</button>
                <a href="/menu" class="btn btn-secondary">Volver al Menú</a>
            </div>

        </form>

    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function sugerirUsuario(forzar = false) {
            const nombre = document.getElementById('font_nombre').value.trim().toLowerCase();
            const apellido = document.getElementById('apellido').value.trim().toLowerCase().split(' ')[0];
            const email = document.getElementById('email').value.trim().toLowerCase();
            const inputUser = document.getElementById('username');

            if (inputUser.value === '' || forzar) {
                if (nombre && apellido) {
                    inputUser.value = `prof.${nombre}.${apellido}`.replace(/[^a-z0-9.]/g, '');
                } else if (email.includes('@')) {
                    inputUser.value = email.split('@')[0];
                }
            }
        }

        function generarPasswordSegura() {
            const caracteres = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789#@!";
            let pass = "";
            for (let i = 0; i < 8; i++) {
                pass += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
            }
            const inputPw = document.getElementById('password');
            inputPw.type = 'text';
            inputPw.value = pass;
        }

        function actualizarInfoRol() {
            const rol = document.getElementById('rol').value;
            const infoBox = document.getElementById('info-rol');

            if (rol === "1") {
                infoBox.style.borderLeftColor = "#8b5cf6";
                infoBox.style.background = "#f3e8ff";
                infoBox.style.color = "#6b21a8";
                infoBox.innerHTML = "📌 <strong>Permisos Administrador:</strong> Control completo del sistema, dar de alta docentes/alumnos y realizar promoción de grado.";
            } else {
                infoBox.style.borderLeftColor = "#3b82f6";
                infoBox.style.background = "#f1f5f9";
                infoBox.style.color = "#475569";
                infoBox.innerHTML = "📌 <strong>Permisos Docente:</strong> Podrá registrar asistencias, capturar calificaciones, publicar tareas y revisar entregas de sus alumnos.";
            }
        }
    </script>

</body>
</html>

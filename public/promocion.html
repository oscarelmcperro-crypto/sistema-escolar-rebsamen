<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promoción Masiva - Enrique C. Rébsamen</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="form-page">

    <div class="form-container-card" style="max-width: 480px;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h2 style="color: #1e293b; font-size: 1.5rem; font-weight: 700; margin: 0;">
                    🎓 Promoción Masiva
                </h2>
                <p style="color: #64748b; font-size: 0.88rem; margin-top: 4px; line-height: 1.4;">
                    Avanza a todos los alumnos del grupo seleccionado al siguiente grado académico.
                </p>
            </div>
            <a href="/menu" class="btn btn-secondary" style="margin: 0; padding: 8px 14px; font-size: 0.85rem;">
                <i class="fa-solid fa-arrow-left"></i> Volver
            </a>
        </div>

        <!-- ADVERTENCIA DE SEGURIDAD -->
        <div style="background-color: #fef2f2; border-left: 4px solid #ef4444; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 0.85rem; color: #991b1b;">
            <i class="fa-solid fa-triangle-exclamation"></i> <strong>Atención:</strong> Esta acción modificará permanentemente el grupo de los estudiantes asociados.
        </div>

        <form action="/procesar-promocion" method="POST" class="standard-form" onsubmit="return confirmarPromocion();">

            <div class="form-group">
                <label for="grupo_origen">Seleccionar Grupo Actual <span style="color: #ef4444;">*</span></label>
                <select id="grupo_origen" name="grupo_origen" required>
                    <option value="" disabled selected>-- Selecciona un grupo --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="grupo_destino">Nuevo Grupo Destino <span style="color: #ef4444;">*</span></label>
                <input type="text" id="grupo_destino" name="grupo_destino" placeholder="Ej. 2°A o EGRESADOS" required>
            </div>

            <button type="submit" class="btn-submit" style="width: 100%; background-color: #16a34a; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s;">
                🚀 Promover Alumnos
            </button>

        </form>

    </div>

    <script>
        // Cargar los grupos existentes dinámicamente desde el backend
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const res = await fetch('/api/grupos-existentes');
                const grupos = await res.json();
                const select = document.getElementById('grupo_origen');

                grupos.forEach(g => {
                    const option = document.createElement('option');
                    option.value = g.grupo;
                    option.textContent = `Grupo ${g.grupo}`;
                    select.appendChild(option);
                });
            } catch (err) {
                console.error("Error al cargar grupos:", err);
            }
        });

        // Confirmación interactiva antes de enviar
        function confirmarPromocion() {
            const origen = document.getElementById('grupo_origen').value;
            const destino = document.getElementById('grupo_destino').value;
            return confirm(`¿Estás seguro de que deseas promover a TODOS los alumnos del grupo "${origen}" al grupo "${destino}"?`);
        }
    </script>

</body>
</html>

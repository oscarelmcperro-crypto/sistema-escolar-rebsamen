<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Alumno - Sistema Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main-content form-page">
        <div class="form-container-card">
            <h1>Agregar Nuevo Alumno</h1>
            <p class="subtitle">Registra la información del estudiante en la base de datos general</p>
            
            <form action="/guardar-alumno" method="POST" class="standard-form">
                <div class="form-group">
                    <label>Nombre(s):</label>
                    <input type="text" name="nombre" placeholder="Nombre del alumno" required>
                </div>
                <div class="form-group">
                    <label>Apellido(s):</label>
                    <input type="text" name="apellido" placeholder="Apellidos" required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico:</label>
                    <input type="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>
                
                <div class="btn-group">
                    <button type="submit" class="btn">Guardar Alumno</button>
                    <a href="/menu" class="btn btn-secondary">Volver al menú</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
